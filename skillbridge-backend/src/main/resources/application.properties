spring.application.name=skillbridge-backend

# Database (override with environment variables; never commit real credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillbridge?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
skillbridge.jwt.secret=${JWT_SECRET:change-me-local-dev-only-secret-key-at-least-32-bytes}
skillbridge.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS (comma-separated)
skillbridge.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Resume uploads
skillbridge.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Bootstrap admin account (created on startup only when both are set)
skillbridge.admin.name=${ADMIN_NAME:Platform Admin}
skillbridge.admin.email=${ADMIN_EMAIL:}
skillbridge.admin.password=${ADMIN_PASSWORD:}

logging.level.org.springframework.security=INFO
logging.level.com.skillbridge=INFO
